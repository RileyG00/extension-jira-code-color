<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Jira Inline Code Colorizer — Settings</title>
<link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="wizard">
    <header>
      <h1>Jira Inline Code Colorizer</h1>
      <p class="subtitle">Choose how <code>span.code</code> inline code blocks look on *.atlassian.net</p>
    </header>

    <section class="preview-section">
      <p class="section-label">Preview</p>
      <div class="preview-box">
        This is some text with an inline <span id="preview-code" class="code">code(example)</span> block in it.
      </div>
    </section>

    <section class="themes-section">
      <p class="section-label">Quick themes</p>
      <div id="theme-grid" class="theme-grid"></div>
    </section>

    <section class="custom-section">
      <p class="section-label">Custom colors</p>
      <div class="color-row">
        <label for="text-color">Text color</label>
        <input type="color" id="text-color" />
        <input type="text" id="text-color-hex" class="hex-input" maxlength="7" />
      </div>
      <div class="color-row">
        <label for="bg-color">Background color</label>
        <input type="color" id="bg-color" />
        <input type="text" id="bg-color-hex" class="hex-input" maxlength="7" />
      </div>
    </section>

    <footer>
      <button id="reset-btn" class="secondary">Reset to default</button>
      <span id="save-status" class="save-status" aria-live="polite"></span>
    </footer>
  </div>

  <script src="options.js"></script>
</body>
</html>
